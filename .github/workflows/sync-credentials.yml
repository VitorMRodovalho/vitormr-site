name: Orenu sync — credentials (Phase 2)

# Per ADR-024-orenu-as-source-of-truth-personal-branding-sites.md.
#
# Runs scripts/sync_credentials.py against the Orenu Postgres DB (via
# the ORENU_DATABASE_URL secret) targeting Vitor's /recognition
# Credentials section. Opens a PR if the run produces any file changes;
# if the run is a no-op, no PR is opened (zero-churn idempotency).
#
# Schedule: daily at 06:00 UTC, paired with sarah-rodovalho-site's
# similar workflow. The two run independently — each repo's secret is
# scoped to its own GitHub Actions context.
#
# Manual trigger: workflow_dispatch enabled.
#
# Required GitHub repository configuration (one-time setup):
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Name: ORENU_DATABASE_URL
#      Value: read-only Postgres connection string for the Orenu DB
#   2. Settings → Actions → General → Workflow permissions:
#      ✓ "Read and write permissions"
#      ✓ "Allow GitHub Actions to create and approve pull requests"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sync_*.py'
      - 'scripts/requirements*.txt'
      - 'tests/test_sync_*.py'
      - '.github/workflows/sync-credentials.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - run: pip install -r scripts/requirements-dev.txt
      - run: python -m pytest tests/ -v

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Run sync — credentials (Phase 2)
        id: sync_creds
        env:
          ORENU_DATABASE_URL: ${{ secrets.ORENU_DATABASE_URL }}
        run: |
          # Write logs to /tmp/ so they don't appear in `git status --porcelain`
          # and falsely trigger the auto-PR step.
          set +e
          python scripts/sync_credentials.py --apply 2>&1 | tee /tmp/sync-credentials-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Warning annotation on non-zero exit
        if: steps.sync_creds.outputs.exit_code != '0'
        run: |
          echo "::warning ::Orenu credentials sync emitted warnings (exit=${{ steps.sync_creds.outputs.exit_code }}). See workflow log + sync-output artifact."

      - name: Detect file changes
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "(no file changes — sync is idempotent)"
          fi

      - name: Create or update Pull Request
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: orenu-sync/credentials
          delete-branch: true
          commit-message: |
            chore(orenu-sync): credentials frontmatter — daily run

            Generated by .github/workflows/sync-credentials.yml.
            Source of truth: Orenu dim_credential WHERE public_visibility = true
            AND person_entity_id = Vitor's dim_entity row.

            Assisted-By: Claude (Anthropic) <noreply@anthropic.com>
          title: 'chore(orenu-sync): credentials — daily run'
          body: |
            ## Daily Orenu → site credentials sync

            Automated daily run of `scripts/sync_credentials.py --apply`.
            Per [ADR-024](https://github.com/VitorMRodovalho/rodovalho-finance/blob/main/decisions/ADR-024-orenu-as-source-of-truth-personal-branding-sites.md).

            **Phase 2 · credentials** — exit ${{ steps.sync_creds.outputs.exit_code }}

            (Exit `0` = clean run · `1` = drift / stubs / orphans surfaced for review · `2` = fatal error.)

            ## Review checklist

            - [ ] Status / dates updates — confirm against issuing-body records
            - [ ] Drift warnings — confirm canonical title / organization
            - [ ] Stubs needed — create MDX for new Orenu public rows
            - [ ] Orphan MDX — flip Orenu `public_visibility = true` or archive

            Auto-generated; safe to close without merging if changes look wrong. Full sync output attached as workflow artifacts.
          labels: |
            orenu-sync
            automated

      - name: Upload sync output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sync-output
          path: /tmp/sync-credentials-output.txt
          if-no-files-found: warn

      - name: Summary when no changes
        if: steps.diff.outputs.has_changes != 'true'
        run: echo "::notice ::No file changes from sync run — fully idempotent."
