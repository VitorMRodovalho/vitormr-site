name: Orenu sync — credentials + awards + community (Phase 2 + 3a + 3b)

# Per ADR-024 / ADR-024.1.
#
# Runs Orenu → site sync scripts sequentially:
#   - scripts/sync_credentials.py (Phase 2;  dim_credential)
#   - scripts/sync_awards.py       (Phase 3a; dim_award)
#   - scripts/sync_community.py    (Phase 3b; fact_community_service)
# Targets Vitor's /recognition page collections. Opens a single PR if
# any script produces file changes; if all are no-ops, no PR is
# opened (zero-churn idempotency).
#
# EVERY run — including a fully idempotent one — also writes a dated
# verification record to docs/orenu-sync-ledger.md and commits it straight
# to main. Content still goes through the reviewed PR; only the ledger is
# machine-written. Read the header of scripts/write_sync_ledger.py before
# changing that: the record exists to evidence the §4 non-contradiction
# gate of the integration contract, and keeping this workflow from being
# auto-disabled after 60 days of repo inactivity is a side effect, not the
# reason. A record that only proved "something ran" would fix half of it.
#
# Schedule: daily at 06:00 UTC, paired with sarah-rodovalho-site's
# similar workflow. The two run independently — each repo's secret is
# scoped to its own GitHub Actions context.
#
# Manual trigger: workflow_dispatch enabled.
#
# Required GitHub repository configuration (one-time setup):
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Name: ORENU_DATABASE_URL
#      Value: read-only Postgres connection string for the Orenu DB
#   2. Settings → Actions → General → Workflow permissions:
#      ✓ "Read and write permissions"
#      ✓ "Allow GitHub Actions to create and approve pull requests"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sync_*.py'
      - 'scripts/requirements*.txt'
      - 'tests/test_sync_*.py'
      - 'scripts/write_sync_ledger.py'
      - 'tests/test_write_sync_ledger.py'
      - '.github/workflows/sync-credentials.yml'

permissions:
  contents: write
  pull-requests: write

# Two runs writing the ledger would race on the push to main.
concurrency:
  group: orenu-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - run: pip install -r scripts/requirements-dev.txt
      - run: python -m pytest tests/ -v

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Run sync — credentials (Phase 2)
        id: sync_creds
        env:
          ORENU_DATABASE_URL: ${{ secrets.ORENU_DATABASE_URL }}
        run: |
          # Write logs to /tmp/ so they don't appear in `git status --porcelain`
          # and falsely trigger the auto-PR step.
          set +e
          python scripts/sync_credentials.py --apply 2>&1 | tee /tmp/sync-credentials-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Run sync — awards (Phase 3a)
        id: sync_awards
        env:
          ORENU_DATABASE_URL: ${{ secrets.ORENU_DATABASE_URL }}
        run: |
          set +e
          python scripts/sync_awards.py 2>&1 | tee /tmp/sync-awards-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Run sync — community (Phase 3b)
        id: sync_community
        env:
          ORENU_DATABASE_URL: ${{ secrets.ORENU_DATABASE_URL }}
        run: |
          set +e
          python scripts/sync_community.py 2>&1 | tee /tmp/sync-community-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Warning annotation on non-zero exit
        if: steps.sync_creds.outputs.exit_code != '0' || steps.sync_awards.outputs.exit_code != '0' || steps.sync_community.outputs.exit_code != '0'
        run: |
          echo "::warning ::Orenu sync emitted warnings (creds=${{ steps.sync_creds.outputs.exit_code }}, awards=${{ steps.sync_awards.outputs.exit_code }}, community=${{ steps.sync_community.outputs.exit_code }}). See workflow log + sync-output artifact."

      - name: Detect file changes
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "(no file changes — sync is idempotent)"
          fi

      - name: Create or update Pull Request
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: orenu-sync/daily
          delete-branch: true
          # Content only. The ledger is committed to main by the step below —
          # it must never ride inside the reviewed content PR, or a day with no
          # content change would still open one and the zero-churn property
          # (the thing that makes a PR mean something) would be lost.
          add-paths: |
            src/content/credentials/**
            src/content/awards/**
            src/content/community/**
          commit-message: |
            chore(orenu-sync): site content frontmatter — daily run

            Generated by .github/workflows/sync-credentials.yml.
            Sources of truth:
              - dim_credential          WHERE public_visibility = true (Phase 2)
              - dim_award               WHERE public_visibility = true (Phase 3a)
              - fact_community_service  WHERE public_visibility = true (Phase 3b)
            Person filter: Vitor's dim_entity row.

            Assisted-By: Claude (Anthropic) <noreply@anthropic.com>
          title: 'chore(orenu-sync): site content — daily run'
          body: |
            ## Daily Orenu → site sync

            Automated daily runs of the Orenu sync scripts.
            Per [ADR-024](https://github.com/VitorMRodovalho/rodovalho-finance/blob/main/decisions/ADR-024-orenu-as-source-of-truth-personal-branding-sites.md).

            **Phase 2 · credentials** — exit ${{ steps.sync_creds.outputs.exit_code }}
            **Phase 3a · awards** — exit ${{ steps.sync_awards.outputs.exit_code }}
            **Phase 3b · community** — exit ${{ steps.sync_community.outputs.exit_code }}

            (Exit `0` = clean run · `1` = drift / stubs / orphans surfaced for review · `2` = fatal error.)

            ## Review checklist

            - [ ] Status / dates updates — confirm against issuing-body records
            - [ ] Drift warnings — confirm canonical title / organization
            - [ ] Stubs needed — create MDX for new Orenu public rows
            - [ ] Orphan MDX — flip Orenu `public_visibility = true` or archive

            Auto-generated; safe to close without merging if changes look wrong. Full sync output attached as workflow artifacts.
          labels: |
            orenu-sync
            automated

      - name: Upload sync output as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sync-output
          path: |
            /tmp/sync-credentials-output.txt
            /tmp/sync-awards-output.txt
            /tmp/sync-community-output.txt
          if-no-files-found: warn

      - name: Summary when no changes
        if: steps.diff.outputs.has_changes != 'true'
        run: echo "::notice ::No file changes from sync run — fully idempotent."

      # Runs on EVERY scheduled/manual execution, including a fully idempotent
      # one, and even if a sync step blew up — a run we could not read must be
      # recorded as unreadable, not omitted. Silence is what let the previous
      # failure go unnoticed for weeks.
      - name: Dated verification record
        if: always()
        env:
          CREDS_EXIT: ${{ steps.sync_creds.outputs.exit_code || '99' }}
          AWARDS_EXIT: ${{ steps.sync_awards.outputs.exit_code || '99' }}
          COMMUNITY_EXIT: ${{ steps.sync_community.outputs.exit_code || '99' }}
        run: |
          set -euo pipefail

          # Start from a clean main: content changes (if any) are already in the
          # PR branch, and the ledger must be the only thing in this commit.
          git fetch origin main
          git checkout -B main origin/main

          python scripts/write_sync_ledger.py \
            --ledger docs/orenu-sync-ledger.md \
            --phase "credentials:/tmp/sync-credentials-output.txt:${CREDS_EXIT}" \
            --phase "awards:/tmp/sync-awards-output.txt:${AWARDS_EXIT}" \
            --phase "community:/tmp/sync-community-output.txt:${COMMUNITY_EXIT}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/orenu-sync-ledger.md

          if git diff --cached --quiet; then
            echo "::warning ::Ledger unchanged — a scheduled run should always add a row. Investigate before trusting the next green."
            exit 0
          fi

          git commit -m "chore(orenu-sync): registro de verificação $(date -u +%Y-%m-%d)

          Gerado por scripts/write_sync_ledger.py. Evidencia as pernas 1, 2 e 4
          do gate de não-contradição (contrato de integração §4). Não cobre a
          perna 3 (OPSEC em prosa), que não é verificável por máquina.

          Assisted-By: Claude (Anthropic) <noreply@anthropic.com>"

          # main can move between fetch and push; rebase once rather than fail
          # the run over a benign race.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git fetch origin main && git rebase origin/main
          done
          echo "::error ::Could not push the verification record after 3 attempts."
          exit 1
