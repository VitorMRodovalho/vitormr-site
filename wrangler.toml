# Cloudflare Workers config — Workers Static Assets with a thin redirect wrapper.
#
# worker.js exists solely to 301-redirect www.vitormr.dev → apex. Everything
# else falls through to env.ASSETS, which serves dist/ identically to the
# prior static-only deployment. Pattern still mirrors sarah-rodovalho-site;
# if that site also gets duplicate-content signals on www, port worker.js
# verbatim (s/vitormr.dev/sarahrodovalho.com/).
#
# Build (dashboard-configured): pnpm install && pnpm build → ./dist
# Deploy (dashboard-configured): npx wrangler deploy
# Custom domain `vitormr.dev` apex: configure via dashboard
# (Workers & Pages → vitormr-site → Settings → Triggers → Custom Domains).
# Critical: must NOT break existing orenu.vitormr.dev / panorama.vitormr.dev /
# meridianiq.vitormr.dev / nucleoia.vitormr.dev subdomains. Apex binding is
# orthogonal to subdomain Workers.

name = "vitormr-site"
main = "./worker.js"
compatibility_date = "2026-05-09"
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Default behaviour serves matched static assets BEFORE invoking the Worker,
# which means the www→apex redirect in worker.js never fires for paths that
# exist in dist/ (i.e. every page). run_worker_first = true inverts that:
# every request hits worker.js first, and non-www requests fall through via
# env.ASSETS.fetch. Latency overhead per request is microseconds.
run_worker_first = true
